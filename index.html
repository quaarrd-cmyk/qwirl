<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qwirl</title>
<style>
:root{--bg:#FAF7F1;--card:#fff;--ink:#1E1535;--mut:#6E6890;--vio:#2A1A66;--soft:#E7E0FF;--line:rgba(42,26,102,.12);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14111F;--card:#1E1A2E;--ink:#F1EDFF;--mut:#A59FC4;--vio:#CFC4FF;--soft:#2D2650;--line:rgba(207,196,255,.14);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14111F;--card:#1E1A2E;--ink:#F1EDFF;--mut:#A59FC4;--vio:#CFC4FF;--soft:#2D2650;--line:rgba(207,196,255,.14);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.hid{display:none!important}
.petal{fill:none;stroke:var(--vio);stroke-width:2.5}.dot{fill:var(--vio)}
.an .petal{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.65,0,.35,1) forwards;animation-delay:calc(var(--i)*.09s)}
.an .spin{transform-box:view-box;transform-origin:50% 50%;animation:spin 2.4s cubic-bezier(.5,0,.2,1) .2s both}
.an .dot{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) 1.1s both}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes spin{from{transform:rotate(-120deg) scale(.6)}to{transform:none}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ring{from{opacity:.35;transform:scale(.8)}to{opacity:0;transform:scale(2.3)}}
@keyframes beat{40%{transform:scale(1.4)}}
#splash{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding-bottom:calc(48px + env(safe-area-inset-bottom,0px));transition:opacity .7s ease,transform .7s ease}
#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
.mark{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
.mark svg{width:150px;height:150px;overflow:visible}
.ring{position:absolute;width:150px;height:150px;border-radius:50%;border:1.5px solid var(--vio);opacity:0;animation:ring 1.7s ease-out 1.2s forwards}
.from{text-align:center;color:var(--mut);font-size:15px;letter-spacing:.5px;opacity:0;animation:up .7s ease 1.5s forwards}
.qlogo{display:block;width:64px;height:74px;object-fit:cover;border-radius:20px;margin:12px auto 0;opacity:0;animation:up .7s ease 1.75s forwards}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 110px}
.onb{padding-top:40px;animation:up .6s both}.onb h1{margin:12px 0 14px;font-size:30px}.onb .mk svg{width:56px;height:56px}
input[type=text],input[type=email],input[type=password],select,textarea{width:100%;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:13px;font:inherit;margin-top:10px}
textarea{min-height:100px;resize:none;margin-top:0}
.btn{display:block;width:100%;background:var(--vio);color:var(--bg);font-weight:700;padding:14px 20px;border-radius:16px;transition:transform .15s,opacity .2s}.btn:active{transform:scale(.97)}.btn[disabled]{opacity:.35}
.err{color:#E0457B;font-size:14px;min-height:20px;margin-top:10px}.lnk{color:var(--vio);font-weight:600;text-decoration:underline}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:12px 16px 4px}
.hd>div{max-width:560px;margin:0 auto}.top{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;margin-bottom:10px}.top svg{width:30px;height:30px}.top .petal{stroke-width:4}.top button{margin-left:auto;font-size:14px;font-weight:700;color:var(--vio)}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:999px;padding:4px}
.seg button{position:relative;z-index:1;padding:9px 0;font-weight:700;color:var(--mut);transition:color .3s}.seg button.on{color:var(--vio)}
.pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--card);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.1);transition:transform .45s cubic-bezier(.5,1.4,.5,1)}.pill.r{transform:translateX(100%)}
.sub{display:flex;gap:20px;padding:10px 4px 0;border-bottom:1px solid var(--line)}.sub button{font-weight:700;color:var(--mut);padding-bottom:8px;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.25s}.sub .on{color:var(--ink);border-color:var(--vio)}
.pr{background:var(--vio);color:var(--bg);border-radius:22px;padding:18px;margin:14px 0;animation:up .5s both}.pr b{display:block;font-size:12px;opacity:.75;letter-spacing:.6px;text-transform:uppercase}.pr p{margin:6px 0 14px;font-size:19px;font-weight:650;line-height:1.3}.pr button{background:var(--bg);color:var(--vio);font-weight:700;padding:9px 16px;border-radius:99px}
.vb{background:var(--soft);color:var(--vio);border-radius:14px;padding:10px 14px;margin:12px 0;font-size:14px}.vb button{font-weight:700;text-decoration:underline;margin-left:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;margin:14px 0;overflow:hidden;animation:up .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
.ch{display:flex;align-items:center;gap:10px;padding:12px 14px}.ch .rt{margin-left:auto;display:flex;gap:6px;align-items:center}
.av{width:38px;height:38px;border-radius:50%;background:var(--soft);color:var(--vio);display:grid;place-items:center;font-weight:800;flex:none}
.nm{font-weight:700;line-height:1.2}.sm{font-size:13px;color:var(--mut)}
.bd{font-size:11px;font-weight:700;background:var(--soft);color:var(--vio);padding:2px 7px;border-radius:99px;margin-left:6px}
.fol{font-weight:700;font-size:14px;padding:6px 14px;border-radius:99px;border:1px solid var(--vio);color:var(--vio);transition:.25s}.fol.on{background:var(--vio);color:var(--bg)}
.mn{padding:6px 8px;color:var(--mut);letter-spacing:1px}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.car::-webkit-scrollbar{display:none}
.slide{flex:none;width:100%;aspect-ratio:1/1;scroll-snap-align:center}
.dots{display:flex;justify-content:center;gap:5px;padding:10px 0 0}.dots i{width:6px;height:6px;border-radius:99px;background:var(--line);transition:.3s}.dots i.on{background:var(--vio);width:16px}
.tx{padding:12px 16px 4px;white-space:pre-wrap;overflow-wrap:anywhere}.t .tx{font-size:18px;padding-top:2px}
.act{padding:6px 10px 12px}.lk{display:inline-flex;align-items:center;gap:6px;padding:6px 8px;border-radius:99px;color:var(--mut);font-size:14px}
.lk svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}.lk.on{color:#E0457B}.lk.on svg{fill:#E0457B;animation:beat .4s ease}
.empty{text-align:center;color:var(--mut);padding:40px 0}.empty svg{width:56px;height:56px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{max-width:560px;margin:auto;display:flex;justify-content:space-around;align-items:center;padding:8px 0}
.nav button{padding:8px 22px;color:var(--mut);transition:color .2s,transform .2s}.nav button.on{color:var(--vio)}.nav button:active{transform:scale(.9)}
.nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .plus{background:var(--vio);color:var(--bg);border-radius:18px;padding:10px 22px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}.ov.on{opacity:1;pointer-events:auto}
.sh{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:auto;background:var(--card);border-radius:26px 26px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .5s cubic-bezier(.2,.9,.2,1);z-index:41;max-height:92%;overflow:auto}.sh.on{transform:none}
.ai{display:block;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line);font-weight:600}.ai.d{color:#E0457B}
.th{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.th div{width:64px;height:64px;border-radius:12px;animation:pop .3s both}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0 14px}
.b2{padding:9px 14px;border:1px solid var(--line);border-radius:14px;font-weight:700;cursor:pointer;color:var(--vio)}
.rp{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}.rules li{margin:6px 0}
.pf{text-align:center;padding:24px 0 8px}.pf .av{width:84px;height:84px;font-size:32px;margin:0 auto 10px}
.ft{text-align:center;color:var(--mut);font-size:13px;padding:24px 0}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;opacity:0;transition:.3s;z-index:70;font-size:14px;pointer-events:none;max-width:90%;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>

<script type="module">

window.__qw=1;const app=initializeApp({apiKey:"AIzaSyDJDWW0KmlB94RKVnFvW62WQVoMnadS3Oo",authDomain:"qwirl-53cb5.firebaseapp.com",projectId:"qwirl-53cb5",storageBucket:"qwirl-53cb5.firebasestorage.app",messagingSenderId:"1088758914104",appId:"1:1088758914104:web:8188962f6ad215b50e5acd"});
const auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

const CC='AF AX AL DZ AS AD AO AI AQ AG AR AM AW AU AT AZ BS BH BD BB BY BE BZ BJ BM BT BO BQ BA BW BR IO BN BG BF BI CV KH CM CA KY CF TD CL CN CX CC CO KM CG CD CK CR CI HR CU CW CY CZ DK DJ DM DO EC EG SV GQ ER EE SZ ET FK FO FJ FI FR GF PF GA GM GE DE GH GI GR GL GD GP GU GT GG GN GW GY HT HN HK HU IS IN ID IR IQ IE IM IL IT JM JP JE JO KZ KE KI KP KR KW KG LA LV LB LS LR LY LI LT LU MO MG MW MY MV ML MT MH MQ MR MU YT MX FM MD MC MN ME MS MA MZ MM NA NR NP NL NC NZ NI NE NG NU NF MK MP NO OM PK PW PS PA PG PY PE PH PN PL PT PR QA RE RO RU RW BL SH KN LC MF PM VC WS SM ST SA SN RS SC SL SG SX SK SI SB SO ZA SS ES LK SD SR SE CH SY TW TJ TZ TH TL TG TK TO TT TN TR TM TC TV UG UA AE GB US UY UZ VU VA VE VN VG VI WF EH YE ZM ZW'.split(' ');

let U=null,me=null,adm=false,tab='m',mode='fol',aum='up',posts=[],fol=new Set,blk=new Set,liked=new Set,ptab='m',imgs=[],act=null,signing=false,sDone=false,aState;
const EM={'auth/email-already-in-use':'That email is already registered.','auth/weak-password':'Password needs 6 or more characters.','auth/invalid-email':'That email doesn’t look right.','auth/invalid-credential':'Wrong email or password.','auth/wrong-password':'Wrong email or password.','auth/user-not-found':'Wrong email or password.','auth/too-many-requests':'Too many tries. Please wait a bit.','auth/network-request-failed':'No connection. Check your internet.'};
const err=m=>{$('#er').textContent=m||'';$('#sb').disabled=false;return false};
function authMode(m){aum=m;$('#ap').classList.toggle('r',m==='in');$$('#as2 button').forEach(b=>b.classList.toggle('on',b.dataset.au===m));$$('.su').forEach(e=>e.classList.toggle('hid',m==='in'));$('#sb').textContent=m==='up'?'Create account':'Log in';$('#er').textContent=''}
function showAuth(m){U=me=null;$('#app').classList.add('hid');$('#au').classList.remove('hid');authMode(aum);$('#er').textContent=m||'';$('#sb').disabled=false}
const ipc=async()=>{try{const c=new AbortController();setTimeout(()=>c.abort(),4000);return(await(await fetch('https://api.country.is',{signal:c.signal})).json()).country||null}catch(e){return null}};
const blockedList=async()=>{try{const s=await getDoc(doc(db,'config','restrictions'));return s.exists()?(s.data().blocked||[]):[]}catch(e){return[]}};
$('#sb').onclick=async()=>{const e=$('#em').value.trim(),pw=$('#pw').value;$('#sb').disabled=true;$('#er').textContent='';
if(aum==='in'){try{await SI(auth,e,pw)}catch(x){err(EM[x.code]||'Could not log in.')}return}
const n=$('#nm').value.trim(),u=$('#un').value.trim().toLowerCase(),c=$('#ct').value;
if(n.length<2)return err('Enter your name.');if(!/^[a-z0-9_]{3,20}$/.test(u))return err('Username: 3 to 20 letters, numbers or _');if(!c)return err('Choose your country.');if(!$('#ag').checked)return err('Please agree to the Community Guidelines.');
const[bl,ip]=await Promise.all([blockedList(),ipc()]);
if(bl.includes(c)||(ip&&bl.includes(ip)))return err('Sorry, Qwirl isn’t available in your country yet.');
try{if((await getDoc(doc(db,'usernames',u))).exists())return err('That username is taken.')}catch(x){}
signing=true;let cr;
try{cr=await CU(auth,e,pw);const b=writeBatch(db);b.set(doc(db,'users',cr.user.uid),{name:n,username:u,country:c,ipCountry:ip,countryMatch:ip?ip===c:null,banned:false,official:false,createdAt:serverTimestamp()});b.set(doc(db,'usernames',u),{uid:cr.user.uid});await b.commit();SV(cr.user).catch(()=>{});signing=false;boot(cr.user)}
catch(x){signing=false;if(cr)try{await cr.user.delete()}catch(y){}err(EM[x.code]||'Could not create the account. Try another username.')}};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('#au'))$('#sb').click()});
async function boot(u){U=u;let s;try{s=await getDoc(doc(db,'users',u.uid))}catch(e){}
if(!s||!s.exists()){await signOut(auth);return showAuth('Account setup was incomplete. Please sign up again.')}
me=s.data();if(me.banned){await signOut(auth);return showAuth('This account has been suspended for breaking the Community Guidelines.')}
try{adm=(await getDoc(doc(db,'admins',u.uid))).exists()}catch(e){adm=false}
$('#au').classList.add('hid');$('#app').classList.remove('hid');$('#lg').innerHTML=mark(0);await load()}
async function load(){try{const[a,b,c]=await Promise.all([getDocs(query(collection(db,'follows'),where('from','==',U.uid))),getDocs(query(collection(db,'blocks'),where('from','==',U.uid))),getDocs(query(collection(db,'posts'),orderBy('createdAt','desc'),limit(60)))]);
fol=new Set(a.docs.map(d=>d.data().to));blk=new Set(b.docs.map(d=>d.data().to));posts=c.docs.map(d=>({id:d.id,...d.data()}));
const L=await Promise.all(posts.slice(0,30).map(p=>getDoc(doc(db,'posts',p.id,'likes',U.uid))));liked=new Set(L.map((s,i)=>s.exists()?posts[i].id:null).filter(Boolean))}catch(e){toast('Could not load the feed. Check your connection.')}show('home')}
const FL=()=>posts.filter(p=>p.f===tab&&!blk.has(p.uid)&&(mode==='dis'?p.uid!==U.uid:(fol.has(p.uid)||p.uid===U.uid)));
function card(p,i){const own=p.uid===U.uid,ts=p.createdAt?p.createdAt.toMillis():Date.now(),f=fol.has(p.uid),im=(p.im||[]).filter(g=>String(g).startsWith('data:image/'));
return `<article class="card ${p.f==='t'?'t':''}" style="--d:${Math.min(i,6)*.07}s"><div class="ch"><div class="av">${esc((p.name||'?')[0].toUpperCase())}</div><div><div class="nm">${esc(p.name)}${p.official?'<span class="bd">Official</span>':''}</div><div class="sm">@${esc(p.username)} · ${ago(ts)}</div></div><div class="rt">${!own&&mode==='dis'?`<button class="fol ${f?'on':''}" data-fol="${p.uid}">${f?'Following':'Follow'}</button>`:''}<button class="mn" data-menu="${p.id}" aria-label="More options">•••</button></div></div>${im.length?`<div class="car">${im.map(g=>`<div class="slide" style="background:url(${g}) center/cover"></div>`).join('')}</div>${im.length>1?`<div class="dots">${im.map((_,k)=>`<i class="${k?'':'on'}"></i>`).join('')}</div>`:''}`:''}${p.text?`<div class="tx">${esc(p.text)}</div>`:''}<div class="act"><button class="lk ${liked.has(p.id)?'on':''}" data-like="${p.id}" aria-label="Like">${HEART}<span>${p.likes||0}</span></button></div></article>`}
function render(){$('#hp').classList.toggle('r',tab==='t');$$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));$$('.sub button').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));
const P=tab==='m'?['Moment of the Day','Show us your view right now.','Share a moment']:['Thought of the Day','What small thing made your day better?','Share a thought'],L=FL();
$('#feed').innerHTML=(U.emailVerified?'':`<div class="vb">Verify your email to post. We sent a link to ${esc(U.email)}.<button data-resend>Resend</button><button data-vdone>I’ve verified</button></div>`)+`<div class="pr"><b>${P[0]}</b><p>${P[1]}</p><button data-open>${P[2]}</button></div>`+(L.length?L.map(card).join(''):`<div class="empty">${mark(0)}<p>Nothing here yet.<br>${mode==='fol'?'Follow people in Discover, or post':'Be the first to post'} something.</p></div>`)}
function profile(){const m=posts.filter(p=>p.uid===U.uid);
$('#prof').innerHTML=`<div class="pf"><div class="av">${esc(me.name[0].toUpperCase())}</div><div class="nm" style="font-size:22px">${esc(me.name)}${me.official?'<span class="bd">Official</span>':''}</div><div class="sm">@${esc(me.username)} · ${esc(dn.of(me.country))}</div><div class="sm" style="margin-top:6px">${m.length} posts · ${fol.size} following</div><div class="row" style="justify-content:center"><button class="b2" data-rules>Community Guidelines</button><button class="b2" data-out>Log out</button></div></div>${adm?'<div id="adm"><div class="sm">Loading admin tools…</div></div>':''}`+m.map(card).join('')+`<div class="ft">Made by Quaarrd</div>`;if(adm)admin()}
function show(v){const h=v==='home';$('#hd').classList.toggle('hid',!h);$('#feed').classList.toggle('hid',!h);$('#prof').classList.toggle('hid',h);$$('[data-nav]').forEach(b=>b.classList.toggle('on',b.dataset.nav===v));h?render():profile();scrollTo(0,0)}
const sheet=(id,html)=>{if(html)$('#'+id).innerHTML=html;$('#ov').classList.add('on');$('#'+id).classList.add('on')};
const closeAll=()=>{$('#ov').classList.remove('on');$$('.sh').forEach(s=>s.classList.remove('on'))};
const RULES=`<h3 style="margin-top:0">Community Guidelines</h3><ul class="rules"><li>Be kind. No harassment, bullying, threats or hate.</li><li>Keep it clean. No nudity, sexual content or graphic violence.</li><li>No scams, spam, or pretending to be someone else.</li><li>Nothing illegal, and nothing that puts others at risk, especially children.</li><li>Only post what is yours to share, and respect other people’s privacy.</li><li>Qwirl may remove posts and suspend accounts that break these rules.</li><li>See something wrong? Use the ••• menu to report it.</li></ul><div class="sm">We keep your name, username, email, country and posts to run Qwirl. We don’t sell your data.</div><button class="btn" data-close style="margin-top:14px">Got it</button>`;
function menu(id){const p=posts.find(x=>x.id===id),own=p.uid===U.uid;act=p;
sheet('as',(own?'<button class="ai d" data-a="del">Delete post</button>':`<button class="ai" data-a="rep">Report post</button><button class="ai" data-a="blk">Block @${esc(p.username)}</button>`)+(adm&&!own?'<button class="ai d" data-a="rm">Admin: remove post</button><button class="ai d" data-a="ban">Admin: ban user</button>':'')+'<button class="ai" data-close>Cancel</button>')}
async function banUser(uid){await updateDoc(doc(db,'users',uid),{banned:true});const s=await getDocs(query(collection(db,'posts'),where('uid','==',uid))),b=writeBatch(db);s.forEach(d=>b.delete(d.ref));await b.commit();posts=posts.filter(p=>p.uid!==uid)}
async function doAct(a){const p=act;closeAll();try{
if(a==='del'||a==='rm'){await deleteDoc(doc(db,'posts',p.id));posts=posts.filter(x=>x.id!==p.id);toast('Post removed')}
else if(a==='blk'){await setDoc(doc(db,'blocks',U.uid+'_'+p.uid),{from:U.uid,to:p.uid});blk.add(p.uid);toast('Blocked')}
else if(a==='ban'){await banUser(p.uid);toast('User banned and posts removed')}
else if(a==='rep'){return sheet('as',['Inappropriate or sexual content','Hate or harassment','Spam or scam','Something else'].map(r=>`<button class="ai" data-reason="${r}">${r}</button>`).join('')+'<button class="ai" data-close>Cancel</button>')}
}catch(e){toast('That didn’t work: '+(e.code||'error'))}show(!$('#prof').classList.contains('hid')?'prof':'home')}
async function admin(){const el=$('#adm');try{const[r,c]=await Promise.all([getDocs(query(collection(db,'reports'),orderBy('createdAt','desc'),limit(30))),getDoc(doc(db,'config','restrictions'))]);
el.innerHTML=`<h3>Admin tools</h3><div class="sm">Blocked country codes (example: KP, IR)</div><input id="bc" type="text" value="${esc(((c.exists()?c.data().blocked:[])||[]).join(', '))}"><button class="btn" data-savebc style="margin-top:10px">Save blocked countries</button><h3>Reports (${r.size})</h3>`+(r.docs.map(d=>{const x=d.data();return `<div class="rp"><div class="sm">${esc(x.reason)}</div><div>${esc(x.snip||'(photo post)')}</div><div class="row"><button class="b2" data-rrm="${d.id}|${x.postId}">Remove post</button><button class="b2" data-rban="${d.id}|${x.postUid}">Ban user</button><button class="b2" data-rdis="${d.id}">Dismiss</button></div></div>`}).join('')||'<div class="sm">No reports right now.</div>')}catch(e){el.innerHTML='<div class="sm">Admin tools unavailable.</div>'}}
async function like(id,btn){const p=posts.find(x=>x.id===id),on=liked.has(id),b=writeBatch(db),r=doc(db,'posts',id,'likes',U.uid);on?b.delete(r):b.set(r,{t:serverTimestamp()});b.update(doc(db,'posts',id),{likes:increment(on?-1:1)});
try{await b.commit();on?liked.delete(id):liked.add(id);p.likes=(p.likes||0)+(on?-1:1);btn.classList.toggle('on',!on);btn.querySelector('span').textContent=p.likes}catch(e){toast('Try again')}}
async function follow(uid,btn){const r=doc(db,'follows',U.uid+'_'+uid),on=fol.has(uid);try{on?await deleteDoc(r):await setDoc(r,{from:U.uid,to:uid});on?fol.delete(uid):fol.add(uid);btn.classList.toggle('on',!on);btn.textContent=on?'Follow':'Following'}catch(e){toast('Try again')}}
function openSheet(f){if(!U.emailVerified)return toast('Please verify your email first');ptab=f||tab;imgs=[];$('#tx').value='';thumbs();pts();sheet('sh')}
const pts=()=>{$('#cp').classList.toggle('r',ptab==='t');$$('#pt button').forEach(b=>b.classList.toggle('on',b.dataset.pt===ptab))};
const thumbs=()=>{$('#th').innerHTML=imgs.map((g,i)=>`<div data-rm="${i}" role="button" aria-label="Remove photo" style="background:url(${g}) center/cover"></div>`).join('')};
const shrink=f=>new Promise(r=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,720/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.6))};i.onerror=()=>r(null);i.src=u});
$('#ph').onchange=async e=>{for(const f of [...e.target.files].slice(0,3-imgs.length)){const d=await shrink(f);if(d)imgs.push(d)}e.target.value='';thumbs()};
$('#pb').onclick=async()=>{const tx=$('#tx').value.trim();if(ptab==='m'&&!imgs.length)return toast('Add at least one photo');if(ptab==='t'&&!tx)return toast('Write something first');
if(imgs.join('').length>850000)return toast('Photos are too big. Use fewer.');$('#pb').disabled=true;
try{await addDoc(collection(db,'posts'),{uid:U.uid,name:me.name,username:me.username,official:me.official,f:ptab,text:tx,im:imgs.slice(),likes:0,createdAt:serverTimestamp()});closeAll();tab=ptab;mode='fol';await load();toast('Posted')}catch(e){toast('Could not post: '+(e.code||'error'))}$('#pb').disabled=false};
$('#ov').onclick=closeAll;
document.addEventListener('click',async e=>{const t=e.target.closest('[data-au],[data-forgot],[data-rules],[data-close],[data-tab],[data-mode],[data-like],[data-fol],[data-open],[data-nav],[data-pt],[data-rm],[data-menu],[data-a],[data-reason],[data-out],[data-refresh],[data-resend],[data-vdone],[data-savebc],[data-rrm],[data-rban],[data-rdis]');if(!t)return;const d=t.dataset;
if(d.au)authMode(d.au);
else if('forgot' in d){const m=$('#em').value.trim();if(!m)return err('Type your email above first.');try{await PR(auth,m);err('Password reset email sent. Check your inbox.')}catch(x){err(EM[x.code]||'Could not send the email.')}}
else if('rules' in d)sheet('as',RULES);else if('close' in d)closeAll();
else if(d.tab){tab=d.tab;render()}else if(d.mode){mode=d.mode;render()}
else if(d.like)like(d.like,t);else if(d.fol)follow(d.fol,t);
else if('open' in d)openSheet();else if(d.nav)show(d.nav);
else if(d.pt){ptab=d.pt;pts()}else if(d.rm){imgs.splice(+d.rm,1);thumbs()}
else if(d.menu)menu(d.menu);else if(d.a)doAct(d.a);
else if(d.reason){const p=act;closeAll();try{await addDoc(collection(db,'reports'),{postId:p.id,postUid:p.uid,snip:(p.text||'').slice(0,120),reason:d.reason,by:U.uid,createdAt:serverTimestamp()});toast('Thanks, we’ll review it')}catch(x){toast('Could not send the report')}}
else if('out' in d)signOut(auth);else if('refresh' in d)load();
else if('resend' in d){try{await SV(U);toast('Verification email sent')}catch(x){toast('Please wait a moment and try again')}}
else if('vdone' in d){await U.reload();await U.getIdToken(true);U=auth.currentUser;U.emailVerified?toast('Email verified'):toast('Not verified yet');render()}
else if('savebc' in d){const l=$('#bc').value.split(/[ ,]+/).map(x=>x.toUpperCase()).filter(x=>x.length===2);try{await setDoc(doc(db,'config','restrictions'),{blocked:l});toast('Saved')}catch(x){toast('Could not save')}}
else if(d.rrm||d.rban||d.rdis){try{const[rid,x]=(d.rrm||d.rban||d.rdis).split('|');if(d.rrm){await deleteDoc(doc(db,'posts',x));posts=posts.filter(p=>p.id!==x)}if(d.rban)await banUser(x);await deleteDoc(doc(db,'reports',rid));toast('Done');admin()}catch(x){toast('That didn’t work')}}});
document.addEventListener('scroll',e=>{const c=e.target;if(c.classList&&c.classList.contains('car')){const i=Math.round(c.scrollLeft/c.clientWidth),d=c.nextElementSibling;if(d)[...d.children].forEach((x,k)=>x.classList.toggle('on',k===i))}},true);
function route(){const s=$('#splash');if(s){s.classList.add('out');setTimeout(()=>s.remove(),800)}aState?boot(aState):showAuth()}
OA(auth,u=>{if(signing)return;aState=u||null;if(sDone)route()});
$('#splash .mark').innerHTML='<div class="ring"></div>'+mark(1);
setTimeout(()=>{sDone=true;if(aState!==undefined)route()},matchMedia('(prefers-reduced-motion:reduce)').matches?500:3300);
setTimeout(()=>{if(aState===undefined){aState=null;sDone=true;route();showAuth('Sign-in can’t start here. Please open Qwirl from its web address (https), not from a downloaded file.')}},9000);
</script>
